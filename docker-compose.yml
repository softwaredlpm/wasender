version: '3.8'

services:
  wasender-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wasender-cloud-api
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5001
    volumes:
      - wasender_uploads:/app/uploads
      - wasender_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wasender_network

volumes:
  wasender_uploads:
    driver: local
  wasender_logs:
    driver: local

networks:
  wasender_network:
    driver: bridge
