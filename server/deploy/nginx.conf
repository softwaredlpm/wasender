# ==============================================================================
# WASENDER Cloud VPS Nginx Configuration
# Reverse Proxy, SSL Termination, and Persistent WebSocket Support
# Path: /etc/nginx/sites-available/wasender.conf
# ==============================================================================

upstream wasender_backend {
    server 127.0.0.1:5001 fail_timeout=0;
    keepalive 64;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.wasender.com app.wasender.com;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wasender.com;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.wasender.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wasender.com/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Max upload limit for marketing campaign attachments and invoice PDFs
    client_max_body_size 50M;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --------------------------------------------------------------------------
    # Agent WebSocket Channel (Long-Lived Persistent Connection for Windows Agent)
    # --------------------------------------------------------------------------
    location /agent/ws {
        proxy_pass http://wasender_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 24-hour timeout to maintain permanent Windows PC connection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Browser WebSocket Channel (Ephemeral Telemetry & Live QR Streaming)
    # --------------------------------------------------------------------------
    location /browser/ws {
        proxy_pass http://wasender_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Static Assets & Web Dashboard
    # --------------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://wasender_backend;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # API & General Endpoints
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://wasender_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
